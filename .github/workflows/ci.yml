name: CI — Country Data Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas requests pytest pytest-mock \
            google-cloud-bigquery google-cloud-storage \
            pyarrow pandas-gbq google-cloud-secret-manager

      - name: Run tests
        run: |
          cd api
          pytest
        env:
          GCP_PROJECT_ID: ${{ secrets.COUNTRY_DATA_PROJECT_485122 }}